---
# Config version node. Unique Config name.
# No reason for edit this.
config-version: 1

general:
  # Supported languages (English (en_US), Czech (cs_CZ), German (de_DE), Japanese (ja_JP), Russian (ru_RU), Chinese (zh_CN), Indonesian (ina_IND))
  # Language is automatically chosen from minecraft. However 'lang' in config is default language e.g for players with Spanish lang.
  #lang: 'en_US'

  # Plugin Prefix.
  # For color you can use "§" or "&".
  prefix: "§6§lGreek§8Network§r "

  # Server where players go when restarting this server.
  #  Don't use "§" or "&", if you use that, your really stupid.
  fallback_server: "lobby1"

  # Send message to player when join to the server.
  # For color you can use "§" or "&".
  # If you want not send a message put "" only
  server_join_message: "§aWelcome to the §l§6Greek§8Network"

  # Set gamemode player when Join
  # 2 = Adventure
  # 3 = Specter
  # 1 = Creative
  # 0 = Survival
  gamemode: 2

  # Coords where player Teleport to join.
  x: -71
  y: 97
  z: 12
  lobby: "greek"

Mysql:
  # Mysql Credentials
  # Host (IP) - Username (Default = root) - Password (Password of DataBase)
  # Database (Mysql Table) - Server (Name of this Server)
  host: 127.0.0.1
  username: root
  password: "!d@5$ZIVR!rA"
  database: "greek"
  server: lobby1

# Greek Proxy Config
# Supports more connections
connections:
  lobby1:
    address: play.greekmc.net
    port: 47007
    password: RUlz5uBTdR

# Change log level to log packets in debug mode.
# Set to 0 for no packet logs.
# Set to 1 to log packets except Ping, Pong and connection packets.
# Set to 2 to log all packets.
logLevel: 0
# Interval in ticks to receive data from connection
# Lower interval, faster packet decoding and encoding
tickInterval: 2
# Default client will be used if no clientName specified in api functions
defaultClient: "lobby1"
# Start clients after plugin is enabled.
# Disabling auto start will allow plugins to trigger connection manually.
autoStart: true
